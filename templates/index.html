<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Congés</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="text-center mb-3">
        <img src="{{ url_for('static', filename='ocp_logo.png') }}" alt="OCP Logo" style="width: 120px;">
    </div>

    <h2 class="mb-4 text-center">Gestion des Congés</h2>

    {% if message %}
        <div class="alert alert-info">{{ message }}</div>
    {% endif %}

    <form method="POST" action="/add_conge" class="p-4 border rounded bg-white">
        <div class="mb-3">
            <label for="employe_id" class="form-label">Employé</label>
            <select name="employe_id" id="employe_id" class="form-select" required>
                <option value="">-- Choisir un employé --</option>
                {% for emp in employes %}
                    <option value="{{ emp.id }}">{{ emp.nom }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="date_debut" class="form-label">Date de début</label>
            <input type="date" name="date_debut" id="date_debut" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="date_fin" class="form-label">Date de fin</label>
            <input type="date" name="date_fin" id="date_fin" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Demander un congé</button>
        
        <a href="/calendar_2025" class="btn btn-warning ms-2">Calendrier 2025</a>
        <a href="/register_employe" class="btn btn-secondary ms-2">+ Ajouter un employé</a>
    </form>
</div>

</body>
</html>
