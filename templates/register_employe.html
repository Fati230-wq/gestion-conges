<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un employé</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .logo {
            width: 100px;
            margin-bottom: 20px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        a {
            text-decoration: none;
            color: #007BFF;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.querySelector("form");
            form.addEventListener("submit", (e) => {
                const nom = form.nom.value.trim();
                if (nom === "") {
                    e.preventDefault();
                    alert("Veuillez entrer le nom de l'employé.");
                }
            });
        });
    </script>
</head>
<body>
    <div class="container">
        <div class="text-center mb-3">
            <img src="{{ url_for('static', filename='ocp_logo.png') }}" alt="OCP Logo" style="width: 120px;">
        </div>
        <h2>➕ Ajouter un nouvel employé</h2>
        <form action="/add_employe" method="POST">
            <input type="text" name="nom" placeholder="Nom de l'employé" required>
            <button type="submit">Enregistrer</button>
        </form>
        <p><a href="/">⬅️ Retour à la page d'accueil</a></p>
    </div>
</body>
</html>
